name: Build Windows Agent

on:
  push:
    branches: [main]
    paths:
      - 'reporters/windows/**'
      - '.github/workflows/windows-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# Needed for softprops/action-gh-release to create/update the GitHub Release on tags.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        working-directory: reporters/windows
        run: >
          dotnet publish WindowsAgent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-timeline-windows-agent
          path: reporters/windows/publish/DeviceTimelineWindowsAgent.exe
          retention-days: 30

      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reporters/windows/publish/DeviceTimelineWindowsAgent.exe
