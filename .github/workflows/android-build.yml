name: Build Android APK

on:
  pull_request:
    paths:
      - 'reporters/android/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'reporters/android/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Build APK
        id: build
        env:
          KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 || '' }}
          KS_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KS_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KS_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        working-directory: reporters/android
        run: |
          set -euo pipefail
          version_code=$((39 + GITHUB_RUN_NUMBER))
          if [[ -n "$KEYSTORE_B64" ]]; then
            : "${KS_PASSWORD:?Missing keystore password}" "${KS_ALIAS:?Missing key alias}" "${KS_KEY_PASSWORD:?Missing key password}"
            umask 077
            key_file="$RUNNER_TEMP/hibi-release.jks"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$key_file"
            ORG_GRADLE_PROJECT_keystorePassword="$KS_PASSWORD" \
            ORG_GRADLE_PROJECT_keyAlias="$KS_ALIAS" \
            ORG_GRADLE_PROJECT_keyPassword="$KS_KEY_PASSWORD" \
            gradle :app:assembleRelease --no-daemon -PversionCode="$version_code" -PkeystorePath="$key_file"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "asset=device-timeline-android.apk" >> "$GITHUB_OUTPUT"
          else
            gradle :app:assembleDebug --no-daemon -PversionCode="$version_code"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "asset=device-timeline-android-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect APK
        id: apk
        working-directory: reporters/android
        run: |
          mkdir -p ../../dist
          variant="${{ steps.build.outputs.variant }}"
          asset="${{ steps.build.outputs.asset }}"
          cp "app/build/outputs/apk/$variant/app-$variant.apk" "../../dist/$asset"
          echo "path=dist/$asset" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-timeline-android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: device-timeline-android
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
