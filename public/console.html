<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light">
  <title>时间线 · Hibi 日々</title>
  <script>
    if (location.hash.startsWith('#hibi-confirm=')) {
      window.hibiConfirmation = location.hash.slice(14);
      history.replaceState(null, '', location.pathname + location.search);
    } else if (['#devices','#health-section','#storage-section'].includes(location.hash)) {
      location.replace('/live' + location.hash);
    }
  </script>
  <link rel="stylesheet" href="/day.css"><script type="module" src="/day.js"></script>
</head>
<body data-notion="unconfigured">
<header class="mast"><div class="frame mast-inner">
 <a class="wordmark" href="/" aria-label="Hibi 首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Hibi <span lang="ja">日々</span></a>
 <nav aria-label="主导航"><a href="/" aria-current="page">时间线</a><a href="/live">实时状态</a></nav>
 <button type="button" class="access-btn" id="access">访问设置</button>
</div></header>
<main class="frame">
 <section class="day-heading">
  <div class="title-block"><div class="page-kicker">每日时间线</div><h1 id="day-title">读取日期…</h1><p id="weekday"></p></div>
  <div class="date-controls">
   <button class="chevron" id="prev" aria-label="上一天">‹</button>
   <label class="calendar-control"><span aria-hidden="true" class="calendar-icon"></span>选日期<input type="date" aria-label="选择日期" id="pick-date"></label>
   <button class="chevron" id="next" aria-label="下一天">›</button>
   <button class="today" id="today">今天</button>
  </div>
 </section>
 <p id="status" role="status" hidden></p>
 <section class="ruler-panel" aria-labelledby="ruler-title">
  <div class="ruler-top"><div><h2 id="ruler-title">设备活动</h2><p id="ruler-summary">读取当天记录…</p></div><div class="legend"><span><i></i>使用</span><span><i class="idle"></i>空闲</span><span><i class="point"></i>单次记录</span></div></div>
  <div class="ruler" id="ruler" aria-label="按小时查看设备记录"></div>
  <div class="ruler-foot"><span class="ruler-guide">点选时段，查看当时的记录</span><label class="mobile-hour-label">查看时段 <select id="mobile-hour"><option value="">全天</option></select></label><button id="clear-hour" type="button">查看全天</button></div>
 </section>
 <div class="context-bar"><h2 id="scope-title">全天记录</h2><button id="export" class="text-action" type="button" disabled>导出设备记录 ↓</button></div>
 <div class="jumps" aria-label="当天记录导航"><a href="#activity-title">应用</a><a href="#map-section">位置</a><a href="#body-section">身体</a></div>
 <div class="journal">
  <section class="activity" aria-labelledby="activity-title">
   <div class="block-heading"><h3 id="activity-title">应用记录</h3><select id="filter" aria-label="筛选设备"><option value="">全部设备</option></select></div>
   <details id="ranking"><summary>应用使用时长</summary><div id="rank-list"></div></details>
   <div id="entries" aria-live="polite"></div><button class="more" type="button" id="more" hidden>显示更多</button>
  </section>
  <aside><section class="entry-section" id="map-section"><div class="block-heading"><h3>位置记录</h3></div><div id="map"></div></section>
   <section class="entry-section" id="body-section"><div class="block-heading"><h3>身体记录</h3></div><div id="body"></div></section></aside>
 </div>
 <footer><a href="/live">查看实时设备和身体状态 ↗</a><span id="zone">北京时间</span></footer>
</main>
<dialog id="auth"><form method="dialog" class="dialog-top"><h2>访问设置</h2><button aria-label="关闭" class="close">×</button></form>
 <p id="auth-note">使用 Hibi 只读权限查看身体和位置记录。</p><button type="button" id="notion-pair" hidden>通过 Notion 授权</button>
 <form id="key-form"><label for="key">只读凭据</label><input id="key" type="password" required autocomplete="off"><button type="submit">在此浏览器查看</button></form>
 <button type="button" id="signout" hidden>取消此浏览器授权</button><p role="status" id="auth-state"></p>
</dialog>
</body></html>
