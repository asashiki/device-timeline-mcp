name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'reporters/android/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# Needed for softprops/action-gh-release to create/update the GitHub Release on tags.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: reporters/android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
            gradle assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PkeystorePath="$(pwd)/release.jks" \
              -PkeystorePassword="$KS_PASSWORD" \
              -PkeyAlias="$KS_ALIAS" \
              -PkeyPassword="$KS_KEY_PASSWORD"
          else
            # No signing secrets -> build an installable debug-signed APK.
            gradle assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
          fi

      - name: Collect APK
        id: apk
        working-directory: reporters/android
        run: |
          mkdir -p ../../dist
          found=$(find app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$found" "../../dist/device-timeline-android.apk"
          echo "path=dist/device-timeline-android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-timeline-android
          path: dist/device-timeline-android.apk
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/device-timeline-android.apk
